<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Armillary Beat Catalog</title>

<style>
  body {
    background: radial-gradient(circle at top left, #0D0D0F, #3A2F4F);
    color: #E6E6EB;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Poppins", sans-serif;
    margin: 0;
    padding: 20px;
  }

  .container {
    max-width: 900px;
    margin: auto;
  }

  .glass-box {
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(12px);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 32px;
    border: 1px solid rgba(255,255,255,0.08);
  }

  h2 {
    margin-top: 0;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-size: 14px;
    opacity: 0.9;
  }

  p {
    font-size: 14px;
    opacity: 0.9;
  }

  button {
    background: #FF7A1A;
    border: none;
    color: white;
    padding: 9px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
  }

  button:hover {
    opacity: 0.9;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
    font-size: 14px;
  }

  th, td {
    padding: 10px;
    text-align: left;
    border-bottom: 1px solid rgba(255,255,255,0.12);
  }

  th {
    font-weight: 500;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.08em;
    opacity: 0.8;
  }

  audio {
    width: 160px;
  }

  textarea {
    width: 100%;
    height: 200px;
    padding: 12px;
    border-radius: 12px;
    border: none;
    background: rgba(255,255,255,0.08);
    color: #E6E6EB;
    font-size: 15px;
    resize: vertical;
    outline: none;
  }

  input[type="text"], input[type="file"], select {
    padding: 8px;
    width: 100%;
    margin-bottom: 12px;
    border-radius: 8px;
    border: none;
    outline: none;
    box-sizing: border-box;
    background: rgba(255,255,255,0.08);
    color: #E6E6EB;
  }
  
  input[type="file"] {
    background: transparent;
    padding: 5px 0;
  }
</style>
</head>

<body>
<div class="container">

<!-- BEAT CATALOG -->
<div class="glass-box">
  <h2>Armillary Beat Catalog</h2>
  <p>Beats uploaded by producers will appear here automatically once we connect the dynamic loader.</p>

  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Title</th>
        <th>Artist</th>
        <th>Mood</th>
        <th>Genre</th>
        <th>Play</th>
      </tr>
    </thead>
    <tbody id="beatTable">
      <!-- Placeholder row (will be cleared on load) -->
      <tr>
        <td>1</td>
        <td>Solar Drift</td>
        <td>LaJoJoe</td>
        <td>Ambient / Cosmic</td>
        <td>Experimental</td>
        <td>
          <audio controls>
            <source src="https://ucarecdn.com" type="audio/mpeg">
          </audio>
