<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Armillary Beat Catalog</title>

<style>
  body {
    background: radial-gradient(circle at top left, #0D0D0F, #3A2F4F);
    color: #E6E6EB;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Poppins", sans-serif;
    margin: 0;
    padding: 20px;
  }

  .container {
    max-width: 900px;
    margin: auto;
  }

  .glass-box {
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(12px);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 32px;
    border: 1px solid rgba(255,255,255,0.08);
  }

  h2 {
    margin-top: 0;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-size: 14px;
    opacity: 0.9;
  }

  p {
    font-size: 14px;
    opacity: 0.9;
  }

  button {
    background: #FF7A1A;
    border: none;
    color: white;
    padding: 9px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
  }

  button:hover {
    opacity: 0.9;
  }

  /* Table */
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
    font-size: 14px;
  }

  th, td {
    padding: 10px;
    text-align: left;
    border-bottom: 1px solid rgba(255,255,255,0.12);
  }

  th {
    font-weight: 500;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.08em;
    opacity: 0.8;
  }

  audio {
    width: 160px;
  }

  /* Notepad */
  textarea {
    width: 100%;
    height: 200px;
    padding: 12px;
    border-radius: 12px;
    border: none;
    background: rgba(255,255,255,0.08);
    color: #E6E6EB;
    font-size: 15px;
    resize: vertical;
    outline: none;
  }

  /* Input fields styling */
  input[type="text"], input[type="file"], select {
    padding: 8px;
    width: 100%;
    margin-bottom: 12px;
    border-radius: 8px;
    border: none;
    outline: none;
    box-sizing: border-box;
    background: rgba(255,255,255,0.08);
    color: #E6E6EB;
  }
  
  input[type="file"] {
    background: transparent;
    padding: 5px 0;
  }
</style>
</head>

<body>
<div class="container">

<!-- BEAT CATALOG -->
<div class="glass-box">
  <h2>Armillary Beat Catalog</h2>
  <p>Beats uploaded by producers will appear here automatically once we connect the dynamic loader.</p>

  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Title</th>
        <th>Artist</th>
        <th>Mood</th>
        <th>Genre</th>
        <th>Play</th>
      </tr>
    </thead>
    <tbody id="beatTable">
      <!-- Temporary example row -->
      <tr>
        <td>1</td>
        <td>Solar Drift</td>
        <td>LaJoJoe</td>
        <td>Ambient / Cosmic</td>
        <td>Experimental</td>
        <td>
          <audio controls>
            <source src="https://ucarecdn.com" type="audio/mpeg">
          </audio>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- FREE SUPABASE UPLOADER -->
<div class="glass-box">
  <h2>Upload a Beat</h2>

  <!-- CHANGED: accept="audio/*" opens up the picker to all audio files (mp3, wav, m4a, flac, etc) -->
  <label style="font-size: 12px; opacity: 0.7; display: block; margin-bottom: 4px;">Upload (.mp3, .wav, .m4a, .flac, etc.)</label>
  <input type="file" id="beatFile" accept="audio/*">

  <!-- Metadata form -->
  <div>
    <input type="text" id="title" placeholder="Beat Title">
    <input type="text" id="artist" placeholder="Artist / Producer Name">
    <input type="text" id="mood" placeholder="Mood (optional)">
    <input type="text" id="genre" placeholder="Genre (optional)">
    <button onclick="submitBeat()">Submit Beat</button>
  </div>

  <p id="uploadStatus" style="margin-top:10px;"></p>
</div>

<!-- NOTEPAD -->
<div class="glass-box">
  <h2>Session Notepad</h2>
  <p>Rap Pad.</p>
  <textarea id="noteArea" placeholder="Write notes here..."></textarea>
  <br><br>
  <button onclick="downloadNote()">Download Note</button>
</div>

</div>

<!-- 1. Load the official Supabase client library via CDN first -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// FIXED: Variable renamed to supabaseClient to prevent "Cannot access before initialization" errors
const SUPABASE_URL = "https://purkgjbpvathnxuiultl.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1cmtnamJwdmF0aG54dWl1bHRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NzUxNDUsImV4cCI6MjA5NTA1MTE0NX0.p1yMsIQUnPrvzO42mla1qpJQOVYDS2cvB5m0r0BQOmA";

// FIXED: Uses the explicit window object reference to guarantee the CDN library maps correctly
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function submitBeat() {
  const fileInput = document.getElementById('beatFile');
  const file = fileInput.files[0]; // Ensure index 0 is targeted correctly

  if (!file) {
    document.getElementById("uploadStatus").innerText = "Please select an audio file first.";
    return;
  }

  const title = document.getElementById("title").value;
  const artist = document.getElementById("artist").value;
  const mood = document.getElementById("mood").value;
  const genre = document.getElementById("genre").value;

  if (!title || !artist) {
    document.getElementById("uploadStatus").innerText = "Title and Artist are required.";
    return;
  }

  document.getElementById("uploadStatus").innerText = "Uploading audio file...";

  const fileExtension = file.name.split('.').pop();
  const uniqueFileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExtension}`;

  try {
    // Uses the corrected global client instance wrapper
    const { data: storageData, error: storageError } = await supabaseClient.storage
      .from('beats')
      .upload(uniqueFileName, file, {
        cacheControl: '3600',
        upsert: false
      });

    if (storageError) {
      document.getElementById("uploadStatus").innerText = "Audio upload failed. Check console.";
      console.error("Storage Error:", storageError.message);
      return;
    }

    const { data: urlData } = supabaseClient.storage.from('beats').getPublicUrl(uniqueFileName);
    const publicFileUrl = urlData.publicUrl;

    document.getElementById("uploadStatus").innerText = "Saving metadata...";

    const { error: dbError } = await supabaseClient
      .from('beats')
      .insert([
        { title, artist, mood, genre, file_url: publicFileUrl, uploader_name: artist }
      ]);

    if (!dbError) {
      document.getElementById("uploadStatus").innerText = "Beat uploaded successfully!";
      fileInput.value = "";
      document.getElementById("title").value = "";
      document.getElementById("artist").value = "";
      document.getElementById("mood").value = "";
      document.getElementById("genre").value = "";
      fetchAndDisplayBeats(); // Refresh the grid view
    } else {
      console.error("Database Error:", dbError.message);
      document.getElementById("uploadStatus").innerText = "Database save failed. Check console.";
    }

  } catch (err) {
    console.error("System Error:", err);
    document.getElementById("uploadStatus").innerText = "Network error. Check console.";
  }
}

function downloadNote() {
  const text = document.getElementById("noteArea").value;
  const blob = new Blob([text], { type: "text/plain" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "armillary-note.txt";
  link.click();
}

// Automatically load the catalog when the page initializes
window.addEventListener('DOMContentLoaded', fetchAndDisplayBeats);

  async function fetchAndDisplayBeats() {
  try {
    const { data: beats, error } = await supabaseClient
      .from('beats')
      .select('*');

    if (error) throw error;

    const tableBody = document.getElementById("beatTable");
    
    // Safety check: ensure your HTML container actually exists
    if (!tableBody) {
      console.error("Error: Could not find HTML element with id 'beatTable'");
      return;
    }
    
    tableBody.innerHTML = ""; 

    beats.forEach((beat, index) => {
      const row = document.createElement("tr");
      
      // FIXED: Moved beat.file_url directly into the <audio> tag src attribute
      row.innerHTML = `
        <td>${index + 1}</td>
        <td>${beat.title || 'Untitled'}</td>
        <td>${beat.artist || 'Unknown'}</td>
        <td>${beat.mood || '-'}</td>
        <td>${beat.genre || '-'}</td>
        <td>
          <audio src="${beat.file_url}" controls preload="metadata">
            Your browser does not support the audio element.
          </audio>
        </td>
      `;
      tableBody.appendChild(row);
    });

  } catch (err) {
    console.error("Error loading catalog:", err.message || err);
  }
}


</script>
</body>
</html>
