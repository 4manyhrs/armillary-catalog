<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Armillary Beat Catalog</title>

<style>
  body {
    background: radial-gradient(circle at top left, #0D0D0F, #3A2F4F);
    color: #E6E6EB;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Poppins", sans-serif;
    margin: 0;
    padding: 20px;
  }

  .container {
    max-width: 900px;
    margin: auto;
  }

  .glass-box {
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(12px);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 32px;
    border: 1px solid rgba(255,255,255,0.08);
  }

  h2 {
    margin-top: 0;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-size: 14px;
    opacity: 0.9;
  }

  p {
    font-size: 14px;
    opacity: 0.9;
  }

  button {
    background: #FF7A1A;
    border: none;
    color: white;
    padding: 9px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
  }

  button:hover {
    opacity: 0.9;
  }

.beat-list {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.beat-card {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 20px;
  background: rgba(255,255,255,0.06);
  padding: 20px;
  border-radius: 16px;
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.08);
}

  .beat-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
} 
  
.beat-info h3 {
  margin: 0;
  font-size: 18px;
  font-weight: 600;
}

.beat-info p {
  margin: 0;
  opacity: 0.8;
}

.meta {
  font-size: 12px;
  opacity: 0.6;
}


  .audio-player {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(255,255,255,0.08);
  padding: 8px 12px;
  border-radius: 12px;
  backdrop-filter: blur(8px);
  width: 100%;
  max-width: 420px;
}

.audio-player button {
  background: #FF7A1A;
  border: none;
  color: white;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
}

.audio-player button:hover {
  opacity: 0.85;
}

.audio-player .seek {
  flex: 1;
}

.audio-player .volume {
  width: 70px;
}

.time {
  font-size: 12px;
  opacity: 0.8;
}


  /* Notepad */
  textarea {
    width: 100%;
    height: 200px;
    padding: 12px;
    border-radius: 12px;
    border: none;
    background: rgba(255,255,255,0.08);
    color: #E6E6EB;
    font-size: 16px;
    resize: vertical;
    outline: none;
  }

  /* Input fields styling */
  input[type="text"], input[type="file"], select {
    padding: 8px;
    width: 100%;
    margin-bottom: 12px;
    border-radius: 8px;
    border: none;
    outline: none;
    box-sizing: border-box;
    background: rgba(255,255,255,0.08);
    color: #E6E6EB;
  }
  
  input[type="file"] {
    background: transparent;
    padding: 5px 0;
  }

  .pagination {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin-top: 20px;
}

.pagination button {
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.2);
  padding: 6px 14px;
  border-radius: 8px;
  cursor: pointer;
  color: white;
}

.pagination button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

#pageInfo {
  opacity: 0.7;
  font-size: 14px;
}

#appWrapper {
  min-height: 100vh;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior-y: none;
  touch-action: pan-y;
}

</style>
</head>

<body>
  <div id="appWrapper">
<div class="container">

<!-- BEAT CATALOG -->
<div class="glass-box">
  <h2>Armillary Beat Catalog</h2>
  <p>Beats uploaded by producers will appear here automatically once we connect the dynamic loader.</p>

  <select id="sortSelect" onchange="applySorting()">
  <option value="newest">Newest First</option>
  <option value="oldest">Oldest First</option>
  <option value="az">Title A–Z</option>
  <option value="za">Title Z–A</option>
</select>
  
<div id="beatList" class="beat-list"></div>
  <div class="pagination">
  <button id="prevPage">Previous</button>
  <span id="pageInfo"></span>
  <button id="nextPage">Next</button>
</div>


</div>

<!-- FREE SUPABASE UPLOADER -->
<div class="glass-box">
  <h2>Upload a Beat</h2>

  <!-- CHANGED: accept="audio/*" opens up the picker to all audio files (mp3, wav, m4a, flac, etc) -->
  <label style="font-size: 12px; opacity: 0.7; display: block; margin-bottom: 4px;">Upload (.mp3, .wav, .m4a, .flac, etc.)</label>
 <input 
  id="beatFile" 
  type="file" 
  accept="audio/mpeg, audio/mp3, audio/wav, audio/x-wav, audio/aac, audio/m4a, audio/*" 
/>


  <!-- Metadata form -->
  <div>
    <input type="text" id="title" placeholder="Beat Title">
    <input type="text" id="artist" placeholder="Artist / Producer Name">
   
    <!-- 🔽 Mood dropdown -->
<select id="mood">
  <option value="">Mood (optional)</option>
  <option value="Dark">Dark</option>
  <option value="Chill">Chill</option>
  <option value="Aggressive">Aggressive</option>
  <option value="Emotional">Emotional</option>
  <option value="Happy">Happy</option>
  <option value="Sad">Sad</option>
  <option value="Energetic">Energetic</option>
</select>

<!-- Genre dropdown -->
<select id="genre">
  <option value="">Genre (optional)</option>
  <option value="Trap">Trap</option>
  <option value="Boom Bap">Boom Bap</option>
  <option value="R&B">R&B</option>
  <option value="Drill">Drill</option>
  <option value="Lo-Fi">Lo-Fi</option>
  <option value="Pop">Pop</option>
  <option value="EDM">EDM</option>
  <option value="Hyper-Hop">Hyper-Hop</option>
  <option value="Kingdom">Kingdom</option>
</select>
    
    <button onclick="submitBeat()">Submit Beat</button>
  </div>

  <p id="uploadStatus" style="margin-top:10px;"></p>
</div>

<!-- NOTEPAD -->
<div class="glass-box">
  <h2>Session Notepad</h2>
  <p>Rap Pad.</p>
  <textarea id="noteArea" placeholder="Write notes here..."></textarea>
  <br><br>
  <button onclick="downloadNote()">Download Note</button>
</div>

</div>

<!-- 1. Load the official Supabase client library via CDN first -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>


// FIXED: Variable renamed to supabaseClient to prevent "Cannot access before initialization" errors
const SUPABASE_URL = "https://purkgjbpvathnxuiultl.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1cmtnamJwdmF0aG54dWl1bHRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NzUxNDUsImV4cCI6MjA5NTA1MTE0NX0.p1yMsIQUnPrvzO42mla1qpJQOVYDS2cvB5m0r0BQOmA";

// FIXED: Uses the explicit window object reference to guarantee the CDN library maps correctly
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function submitBeat() {
  const pass = prompt("Enter upload password:");
  if (pass !== "444four") {
    alert("Access denied");
    return; // stops the upload
  }
  const fileInput = document.getElementById('beatFile');
  const file = fileInput.files[0]; // Ensure index 0 is targeted correctly

  if (!file) {
    document.getElementById("uploadStatus").innerText = "Please select an audio file first.";
    return;
  }

  const title = document.getElementById("title").value;
  const artist = document.getElementById("artist").value;
  const mood = document.getElementById("mood").value;
  const genre = document.getElementById("genre").value;

  if (!title || !artist) {
    document.getElementById("uploadStatus").innerText = "Title and Artist are required.";
    return;
  }

  document.getElementById("uploadStatus").innerText = "Uploading audio file...";

  const fileExtension = file.name.split('.').pop();
  const uniqueFileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExtension}`;

  try {
    // Uses the corrected global client instance wrapper
    const { data: storageData, error: storageError } = await supabaseClient.storage
      .from('beats')
      .upload(uniqueFileName, file, {
        cacheControl: '3600',
        upsert: false
      });

    if (storageError) {
      document.getElementById("uploadStatus").innerText = "Audio upload failed. Check console.";
      console.error("Storage Error:", storageError.message);
      return;
    }

    const { data: urlData } = supabaseClient.storage.from('beats').getPublicUrl(uniqueFileName);
    const publicFileUrl = urlData.publicUrl;

    document.getElementById("uploadStatus").innerText = "Saving metadata...";

    const { error: dbError } = await supabaseClient
      .from('beats')
      .insert([
        { title, artist, mood, genre, file_url: publicFileUrl, uploader_name: artist }
      ]);

    if (!dbError) {
      document.getElementById("uploadStatus").innerText = "Beat uploaded successfully!";
      fileInput.value = "";
      document.getElementById("title").value = "";
      document.getElementById("artist").value = "";
      document.getElementById("mood").value = "";
      document.getElementById("genre").value = "";
      fetchAndDisplayBeats(); // Refresh the grid view
    } else {
      console.error("Database Error:", dbError.message);
      document.getElementById("uploadStatus").innerText = "Database save failed. Check console.";
    }

  } catch (err) {
    console.error("System Error:", err);
    document.getElementById("uploadStatus").innerText = "Network error. Check console.";
  }
}

function downloadNote() {
  const text = document.getElementById("noteArea").value;
  const blob = new Blob([text], { type: "text/plain" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "armillary-note.txt";
  link.click();
}

// Automatically load the catalog when the page initializes
window.addEventListener('DOMContentLoaded', fetchAndDisplayBeats);

 async function fetchAndDisplayBeats() {
  try {
    const start = (currentPage - 1) * beatsPerPage;
    const end = start + beatsPerPage - 1;

    // 🔥 Server-side pagination
    const { data: beats, error, count } = await supabaseClient
      .from('beats')
      .select('*', { count: 'exact' })
      .order('id', { ascending: false })
      .range(start, end);

    if (error) throw error;

    allBeats = beats;      // only this page's beats
    totalBeats = count;    // store total count for pagination UI

    renderPage();

  } catch (err) {
    console.error("Error loading catalog:", err.message || err);
  }
}


</script>
  <script>
  let currentAudio = null;
function initCustomPlayers() {
  document.querySelectorAll(".audio-player").forEach(player => {
    const audio = new Audio(player.dataset.src);

    const playBtn = player.querySelector(".play-btn");
    const seek = player.querySelector(".seek");
    const volume = player.querySelector(".volume");
    const currentTimeEl = player.querySelector(".current");
    const durationEl = player.querySelector(".duration");
    const backBtn = player.querySelector(".back");
    const forwardBtn = player.querySelector(".forward");

    playBtn.addEventListener("click", () => {

  // 🔥 Stop previously playing audio
  if (currentAudio && currentAudio !== audio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    if (currentPlayBtn) currentPlayBtn.textContent = "▶";
  }

  // 🔥 Toggle this audio
  if (audio.paused) {
    audio.play();
    playBtn.textContent = "⏸";
    currentAudio = audio;
    currentPlayBtn = playBtn;
  } else {
    audio.pause();
    playBtn.textContent = "▶";
  }
});


    audio.addEventListener("loadedmetadata", () => {
      durationEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener("timeupdate", () => {
      seek.value = (audio.currentTime / audio.duration) * 100;
      currentTimeEl.textContent = formatTime(audio.currentTime);
    });

    seek.addEventListener("input", () => {
      audio.currentTime = (seek.value / 100) * audio.duration;
    });

    volume.addEventListener("input", () => {
      audio.volume = volume.value;
    });

    backBtn.addEventListener("click", () => {
      audio.currentTime = Math.max(0, audio.currentTime - 10);
    });

    forwardBtn.addEventListener("click", () => {
      audio.currentTime = Math.min(audio.duration, audio.currentTime + 10);
    });
  });
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, "0");
  return `${m}:${s}`;
}

    let currentPage = 1;
const beatsPerPage = 7;
let allBeats = [];
let totalBeats = 0;
    
    function applySorting() {
  const mode = document.getElementById("sortSelect").value;

  if (mode === "newest") {
    allBeats.sort((a, b) => b.id - a.id);
  }
  else if (mode === "oldest") {
    allBeats.sort((a, b) => a.id - b.id);
  }
  else if (mode === "az") {
    allBeats.sort((a, b) => a.title.localeCompare(b.title));
  }
  else if (mode === "za") {
    allBeats.sort((a, b) => b.title.localeCompare(a.title));
  }

  currentPage = 1;
  renderPage();
}

    function renderPage() {
  const list = document.getElementById("beatList");
  list.innerHTML = "";

  const pageBeats = allBeats;

  pageBeats.forEach(beat => {
    const card = document.createElement("div");
    card.className = "beat-card";

    card.innerHTML = `
      <div class="beat-info">
        <h3>${beat.title}</h3>
        <p>${beat.artist}</p>
        <p class="meta">${beat.mood || ''} • ${beat.genre || ''}</p>
      </div>

      <div class="audio-player" data-src="${beat.file_url}">
        <button class="play-btn">▶</button>
        <span class="time current">0:00</span>
        <input type="range" class="seek" value="0" min="0" max="100">
        <span class="time duration">0:00</span>
        <button class="skip back">-10</button>
        <button class="skip forward">+10</button>
        <input type="range" class="volume" min="0" max="1" step="0.01" value="1">
      </div>
    `;

    list.appendChild(card);
  });

  initCustomPlayers();
  updatePaginationUI();
}
    function updatePaginationUI() {
  const totalPages = Math.ceil(totalBeats / beatsPerPage);


  document.getElementById("pageInfo").textContent =
    `Page ${currentPage} of ${totalPages}`;

  document.getElementById("prevPage").disabled = currentPage === 1;
  document.getElementById("nextPage").disabled = currentPage === totalPages;
}

document.getElementById("prevPage").addEventListener("click", () => {
  if (currentPage > 1) {
    currentPage--;
    renderPage();
  }
});

document.getElementById("nextPage").addEventListener("click", () => {
  const totalPages = Math.ceil(allBeats.length / beatsPerPage);
  if (currentPage < totalPages) {
    currentPage++;
    renderPage();
  }
});


</script>
</div>
</body>
</html>
